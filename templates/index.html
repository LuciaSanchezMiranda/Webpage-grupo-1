<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
  />
  <link rel="stylesheet" href="/static/css/output.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <title>Mi sitio web</title>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Menú -->
  <nav class="px-4 py-4 sm:flex sm:items-center sm:justify-between bg-red-700 text-white">
    <section class="flex">
      <button class="text-white bg-red-700 hover:bg-red-800 sm:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </section>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
      <button class="text-white bg-red-700 hover:bg-red-800 px-4 py-2 rounded">Inicio</button>
      <button class="text-white bg-red-700 hover:bg-red-800 px-4 py-2 rounded">Acerca de</button>
      <button class="text-white bg-red-700 hover:bg-red-800 px-4 py-2 rounded">Contactos</button>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="flex-grow">
    <div class="p-6 text-center">
      <h1 class="text-3xl font-bold mb-4">Bienvenido a mi sitio web</h1>
      <p class="text-gray-700">Aquí va el contenido principal de la página.</p>
    </div>
  </main>

    <!-- Pie de página -->
  <footer class="bg-red-700 text-white py-6">
    <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <img src="logo.png" alt="Logo" class="w-12 h-12" />
        <span class="text-lg font-semibold">© 2025 Mi Sitio Web</span>
      </div>

      <!-- Dirección -->
      <div class="text-center sm:text-left mt-4 sm:mt-0">
        <p>Av. Libertad , San Vicente de Cañete, Perú</p>
      </div>

      <!-- Redes sociales -->
      <div class="flex space-x-4 mt-4 sm:mt-0">
        <a href="https://facebook.com" target="_blank" class="text-white hover:text-gray-200 text-xl">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://instagram.com" target="_blank" class="text-white hover:text-gray-200 text-xl">
          <i class="fab fa-instagram"></i>
        </a>
      </div>
    </div>


        <!-- Línea separadora -->
        <div class="border-t border-red-600 mt-4 pt-2 text-center text-sm">
            © 2025 Mi Sitio Web
        </div>
    </footer>


</body>
</html>
